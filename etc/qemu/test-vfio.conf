QEMU_ARCH="x86_64"
QEMU_ARGS="-m 4G \
-smp 4,sockets=1,cores=4,threads=1 \
-cpu host,kvm=off \
-machine type=q35,accel=kvm,usb=on,firmware=/usr/share/edk2/ovmf/OVMF_CODE.fd \
-device virtio-scsi,num_queues=4 \
-drive file=/dev/disk/by-path/pci-0000:02:00.0-scsi-0:2:1:0,format=raw,if=none,id=hd0,cache=none,aio=native \
-device scsi-hd,drive=hd0 \
-device vfio-pci,host=01:00.0 \
-nic none \
-device virtio-tablet \
-device virtio-vga \
-display vnc=127.0.0.1:10 \
-serial telnet:127.0.0.1:2010,server,nowait \
-boot menu=off"
